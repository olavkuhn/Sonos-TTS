[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "soco-tts"
version = "0.1.0"
description = "Text-to-speech connector for Sonos devices"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Olav Kuhnen" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "sonos-websocket",
    "flask",
    "edge-tts",
]

[project.scripts]
sonos_tts = "sonos_tts.main:cli"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
sonos_tts = ["*.toml"]

[tool.ruff.lint]
ignore = ["EXE002"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true